<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PhishGuard AI Settings</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 24px; }
    .row { margin-bottom: 12px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    input { width: 480px; max-width: 100%; padding: 8px; }
    .hint { color: #555; font-size: 12px; }
    button { padding: 8px 12px; font-weight: 600; }
  </style>
</head>
<body>
  <h1>PhishGuard AI Settings</h1>
  <div class="row">
    <label for="apiBaseUrl">API Base URL</label>
    <input id="apiBaseUrl" type="url" placeholder="https://your-backend.tld" />
    <div class="hint">Your backend root. The extension will call /api/scan.</div>
  </div>
  <div class="row">
    <label for="apiKey">API Key (optional)</label>
    <input id="apiKey" type="text" placeholder="Bearer token" />
    <div class="hint">Stored locally using chrome.storage. Avoid sensitive prod secrets.</div>
  </div>
  <div class="row">
    <label for="threshold">Threat Threshold (0 - 1)</label>
    <input id="threshold" type="number" step="0.05" min="0" max="1" />
    <div class="hint">Show warning banner when score exceeds this value.</div>
  </div>
  <button id="save">Save</button>

  <script type="module">
    function load() {
      chrome.runtime.sendMessage({ type: 'GET_SETTINGS' }, (resp) => {
        const s = resp?.settings || {};
        document.getElementById('apiBaseUrl').value = s.apiBaseUrl || '';
        document.getElementById('apiKey').value = s.apiKey || '';
        document.getElementById('threshold').value = typeof s.threshold === 'number' ? s.threshold : 0.7;
      });
    }

    function save() {
      const settings = {
        apiBaseUrl: document.getElementById('apiBaseUrl').value.trim(),
        apiKey: document.getElementById('apiKey').value.trim(),
        threshold: Number(document.getElementById('threshold').value),
      };
      chrome.runtime.sendMessage({ type: 'SAVE_SETTINGS', settings }, () => load());
    }

    document.getElementById('save').addEventListener('click', save);
    document.addEventListener('DOMContentLoaded', load);
    load();
  </script>
</body>
</html>
